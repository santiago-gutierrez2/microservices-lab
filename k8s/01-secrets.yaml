# Secret != cifrado por defecto: por dentro son solo base64 (se puede
# decodificar con "kubectl get secret ... -o jsonpath='{.data.x}' | base64 -d").
# La proteccion real viene de RBAC (quien puede leer objetos Secret) y de
# habilitar cifrado en reposo en el etcd del cluster - algo que configura
# el administrador del cluster, no la aplicacion. Aqui usamos "stringData"
# (texto plano) y Kubernetes se encarga de codificarlo a base64 el mismo.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: microservices-lab
type: Opaque
stringData:
  POSTGRES_DB: catalogdb
  POSTGRES_USER: catalog_user
  POSTGRES_PASSWORD: catalog_pass
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db-credentials
  namespace: microservices-lab
type: Opaque
stringData:
  POSTGRES_DB: orderdb
  POSTGRES_USER: order_user
  POSTGRES_PASSWORD: order_pass
