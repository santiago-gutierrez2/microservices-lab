apiVersion: v1
data:
  application-docker.yml: |
    # Sobreescribe application.yml solo para clientes que arrancan con
    # SPRING_PROFILES_ACTIVE=docker (o sea, dentro de docker-compose).
    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka

    spring:
      kafka:
        bootstrap-servers: kafka:19092

    management:
      zipkin:
        tracing:
          endpoint: http://zipkin:9411/api/v2/spans
  application.yml: |
    # Config compartida por TODOS los servicios que la pidan al Config Server.
    # Cada servicio puede sobreescribir cualquiera de estas claves en su propio
    # application.yaml local si necesita un valor distinto.
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka
      instance:
        prefer-ip-address: true

    spring:
      kafka:
        bootstrap-servers: localhost:9092

    management:
      tracing:
        sampling:
          # 1.0 = traza el 100% de las peticiones. En producción real, con
          # volumen alto, esto se baja (ej. 0.1) para no saturar Zipkin.
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://localhost:9411/api/v2/spans
kind: ConfigMap
metadata:
  name: config-repo
  namespace: microservices-lab
