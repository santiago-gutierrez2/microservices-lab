spring:
  application:
    name: catalog-api
  # "optional:" para que el servicio arranque igual si config-server no
  # responde (con lo que ya tenga localmente); sin ese prefijo, un fallo
  # al pedir la config detendria el arranque por completo.
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5433/catalogdb
    username: catalog_user
    password: catalog_pass
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: catalog-service

server:
  port: 8080
