spring:
  application:
    name: catalog-api
  datasource:
    url: jdbc:postgresql://localhost:5433/catalogdb
    username: catalog_user
    password: catalog_pass
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: catalog-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Sin esto, Eureka registra el hostname del contenedor, que otros
    # contenedores no siempre pueden resolver. Con la IP real, siempre funciona.
    prefer-ip-address: true

server:
  port: 8080
