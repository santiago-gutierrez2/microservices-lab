spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Local: relativo a services/config-server. En Docker se sobreescribe
          # (CONFIG_REPO_PATH) para apuntar a donde copiamos config-repo/ en la imagen.
          search-locations: file:${config.repo.path:../../config-repo}

server:
  port: 8888
