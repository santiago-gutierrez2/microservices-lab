spring:
  application:
    name: gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-api
              uri: lb://catalog-api
              predicates:
                - name: Path
                  args:
                    pattern: /api/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - name: Path
                  args:
                    pattern: /api/orders/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

server:
  port: 8082

