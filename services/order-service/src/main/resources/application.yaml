spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5434/orderdb
    username: order_user
    password: order_pass
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  timelimiter:
    instances:
      catalog-api:
        timeout-duration: 2s
  retry:
    instances:
      catalog-api:
        max-attempts: 3
        wait-duration: 200ms
  circuitbreaker:
    instances:
      catalog-api:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  pattern:
    # El patron de correlacion (traceId/spanId) lo pone Spring Boot solo;
    # aqui solo le añadimos eventId, el identificador de negocio para
    # correlacion manual a traves del Outbox/Kafka.
    correlation: "[%X{traceId:-},%X{spanId:-},%X{eventId:-}] "

server:
  port: 8081
