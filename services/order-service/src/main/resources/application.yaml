spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5434/orderdb
    username: order_user
    password: order_pass
  jpa:
    hibernate:
      ddl-auto: update

feign:
  circuitbreaker:
    enabled: true

server:
  port: 8081
